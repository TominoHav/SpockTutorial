<!doctype html><html lang="cs"><head><meta charset="utf-8">
<style>
/* Pitch video 1280 × 720: scéna = nadpis vlevo, snímek aplikace vpravo v okně prohlížeče, české titulky dole. Úvod a závěr: Spock uprostřed. */
*{box-sizing:border-box}html,body{margin:0;width:1280px;height:720px;overflow:hidden;font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:#fff}
#bg{position:absolute;inset:0;background:radial-gradient(1200px 700px at 75% 40%,#2B2470 0%,#141A3A 55%,#0A0E22 100%)}
.stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff}
.sc{position:absolute;inset:0;opacity:0}
.txt{position:absolute;left:72px;top:0;bottom:120px;width:440px;display:flex;flex-direction:column;justify-content:center;gap:16px}
.k{font-size:15px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#F29AC0}
.h{font-size:52px;font-weight:800;line-height:1.05;letter-spacing:-.02em}
.s{font-size:24px;line-height:1.3;color:#C9D2F0}
.win{position:absolute;right:56px;top:50px;width:680px;height:440px;border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 30px 80px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.12)}
.win .bar{height:30px;background:#E9EDF3;display:flex;align-items:center;gap:7px;padding:0 12px}.win .bar i{width:11px;height:11px;border-radius:50%;background:#C8CFD9}
.win .vp{position:absolute;top:30px;left:0;right:0;bottom:0;overflow:hidden}.win img{position:absolute;left:0;top:0;width:100%;transform-origin:30% 20%}
.phone{position:absolute;right:190px;top:24px;width:244px;height:500px;border-radius:38px;background:#0B0F1C;padding:10px;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 2px rgba(255,255,255,.15)}
.phone .vp{position:relative;width:100%;height:100%;border-radius:30px;overflow:hidden;background:#fff}.phone img{width:100%;position:absolute;top:0;left:0}
.center{position:absolute;inset:0 0 120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
.center .h{font-size:64px;max-width:1000px}.center .s{font-size:28px}
.cap{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);max-width:1060px;padding:12px 22px;border-radius:12px;background:rgba(5,8,20,.72);font-size:26px;line-height:1.35;text-align:center;font-weight:500}
.cap:empty{display:none}
.mascot{width:190px;height:190px}
.center.fx{inset:0 0 230px;gap:12px}.center.fx .h{font-size:54px}.facts{display:grid;grid-template-columns:repeat(3,270px);gap:14px;margin-top:8px}.facts div{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:12px 18px;text-align:left}.facts b{display:block;white-space:nowrap;font-size:40px;font-weight:800;letter-spacing:-.02em;background:linear-gradient(90deg,#F29AC0,#B9A6FF);-webkit-background-clip:text;background-clip:text;color:transparent}.facts span{font-size:18px;color:#C9D2F0}
.prog{position:absolute;left:0;bottom:0;height:5px;background:linear-gradient(90deg,#E15079,#A54CB2,#372B91)}
.mtg{position:absolute;inset:-80px;perspective:1400px}.mtg-in{position:absolute;left:50%;top:50%;width:1900px;display:grid;grid-template-columns:repeat(4,460px);gap:20px;transform-style:preserve-3d}
.mtg-in img{width:460px;height:288px;object-fit:cover;object-position:top;border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.55)}
.mtg-veil{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(10,14,34,.25),rgba(10,14,34,.92) 70%)}
.mtg-t{position:absolute;inset:0 0 140px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.mtg-t .h{font-size:68px}.mtg-t .s{font-size:30px}
.fin canvas{position:absolute;inset:0}
.fin-arc{position:absolute;left:0;right:0;top:118px;height:90px}
.st{position:absolute;top:0;width:120px;margin-left:-60px;display:grid;justify-items:center;gap:8px}
.st i{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.35);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:16px;color:#0A0E22;background:transparent}
.st.on i{background:linear-gradient(135deg,#F29AC0,#B9A6FF);border-color:#fff;box-shadow:0 0 22px rgba(242,154,192,.8)}
.st span{font-size:15px;font-weight:700;color:#C9D2F0;letter-spacing:.02em}
.fin-line{position:absolute;top:135px;height:3px;background:linear-gradient(90deg,#F29AC0,#B9A6FF);border-radius:2px;box-shadow:0 0 12px rgba(185,166,255,.8)}
.fin-mid{position:absolute;left:0;right:0;top:210px;display:flex;justify-content:center;align-items:center;gap:34px}
.fin-mid .mascot{width:210px;height:210px}.fin-mid .pde-logo{width:120px;height:120px;border-radius:50%;box-shadow:0 0 40px rgba(120,90,255,.6)}
.fin-glow{position:absolute;left:50%;top:315px;width:900px;height:900px;margin:-450px 0 0 -450px;border-radius:50%;background:radial-gradient(circle,rgba(242,154,192,.45),rgba(120,90,255,.18) 35%,transparent 65%)}
.fin-rays{position:absolute;left:50%;top:315px;width:1600px;height:1600px;margin:-800px 0 0 -800px;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.10) 0deg 4deg,transparent 4deg 18deg);border-radius:50%;-webkit-mask:radial-gradient(circle,#000 10%,transparent 60%);mask:radial-gradient(circle,#000 10%,transparent 60%)}
.fin-h{position:absolute;left:0;right:0;top:450px;text-align:center;font-size:58px;font-weight:800;letter-spacing:-.02em;background:linear-gradient(90deg,#fff 0%,#fff 40%,#F29AC0 50%,#fff 60%,#fff 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
.fin-s{position:absolute;left:0;right:0;top:524px;text-align:center;font-size:30px;font-weight:600;color:#E6DBFF}
.fin-flash{position:absolute;inset:0;background:#fff;opacity:0}
.rk-l{position:absolute;left:80px;top:40px;width:470px;display:grid;gap:10px}
.rk-l .k{margin-bottom:2px}.rk-l .h{font-size:48px}.rk-l .s{font-size:21px;margin-bottom:10px}
.rk{display:flex;align-items:center;gap:14px;padding:9px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);font-size:21px;font-weight:700;color:rgba(255,255,255,.45)}
.rk b{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:14px;border:2px solid rgba(255,255,255,.3)}
.rk.on{color:#fff;background:linear-gradient(90deg,rgba(242,154,192,.22),rgba(185,166,255,.12));border-color:rgba(242,154,192,.6)}.rk.on b{background:linear-gradient(135deg,#F29AC0,#B9A6FF);border-color:#fff;color:#0A0E22}
.rk.cur{box-shadow:0 0 26px rgba(242,154,192,.45)}
.rk-r{position:absolute;left:620px;top:10px;width:600px;height:460px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rk-r .spock{width:270px;height:315px}
.rk-glow{position:absolute;left:50%;top:46%;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;background:radial-gradient(circle,rgba(185,166,255,.45),transparent 62%)}
.rk-name{font-size:30px;font-weight:800;margin-top:6px}.rk-sub{font-size:19px;color:#C9D2F0}
.chips{position:absolute;left:600px;right:40px;top:480px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chips span{padding:8px 16px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);font-size:18px;font-weight:600}
.spock .sp-legs line,.spock .sp-arm line{stroke:var(--limb,#372B91);stroke-width:6;stroke-linecap:round}.spock .sp-arm circle{fill:var(--hand,#A54CB2)}
.spock .sp-ant{stroke:var(--ant,#A54CB2);stroke-width:5;stroke-linecap:round}.spock .sp-tip{fill:var(--tip,#E15079)}.spock .sp-eyes ellipse{fill:var(--eye,#7DE3FF)}
.spock .sp-smile{stroke:var(--eye,#7DE3FF);stroke-width:3;fill:none;stroke-linecap:round}.spock .sp-shadow{fill:rgba(0,0,0,.35)}
.tz-box{position:absolute;left:240px;top:34px;width:800px;height:294px;border-radius:16px;background:#120F2E;box-shadow:0 0 0 2px rgba(255,255,255,.18),0 0 60px rgba(242,154,192,.35),0 30px 80px rgba(0,0,0,.5)}
.tz-t{position:absolute;left:0;right:0;top:360px;text-align:center;display:grid;gap:8px}.tz-t .h{font-size:50px}.tz-t .s{font-size:28px;color:#F29AC0;font-weight:700}
</style></head><body>
<div id="bg"><div class="stars" id="stars"></div></div><div id="sc"></div><div class="cap" id="cap"></div><div class="prog" id="prog"></div>
<script>
const SC = window.__SCENES || [], T = window.__T || {};
const mascot = `<svg class="mascot" viewBox="0 0 120 140"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E15079"/><stop offset=".55" stop-color="#A54CB2"/><stop offset="1" stop-color="#372B91"/></linearGradient></defs><g stroke="#4A37B8" stroke-width="6" stroke-linecap="round"><line x1="49" y1="96" x2="44" y2="122"/><line x1="71" y1="96" x2="76" y2="122"/><line x1="28" y1="70" x2="12" y2="56"/><line x1="92" y1="70" x2="108" y2="54"/></g><circle cx="11" cy="55" r="6" fill="#A54CB2"/><circle cx="109" cy="53" r="6" fill="#A54CB2"/><line x1="60" y1="24" x2="60" y2="10" stroke="#A54CB2" stroke-width="5" stroke-linecap="round"/><circle cx="60" cy="8" r="6" fill="#E15079"/><rect x="30" y="34" width="60" height="60" rx="16" transform="rotate(45 60 64)" fill="url(#g)"/><rect x="38" y="54" width="44" height="22" rx="11" fill="#0C1B2A"/><circle cx="51" cy="64" r="5" fill="#7DE3FF"/><circle cx="69" cy="64" r="5" fill="#7DE3FF"/><path d="M55 71q5 4 10 0" stroke="#7DE3FF" stroke-width="2" fill="none" stroke-linecap="round"/></svg>`;
let st = ''; for (let i = 0; i < 70; i++) { const x = (i * 97) % 1280, y = (i * 53 + i * i * 7) % 720, o = .15 + (i % 7) / 12; st += `<i style="left:${x}px;top:${y}px;opacity:${o};transform:scale(${.5 + (i % 3) * .4})"></i>`; } document.getElementById('stars').innerHTML = st;
const root = document.getElementById('sc');
if (window.__PDE) { eval('window.__PDE_N = 0;' + window.__PDE.replace('function pdeLogo', 'window.pdeLogo = function').replace(/PDE_N/g, 'window.__PDE_N')); }
if (window.__SPK) { eval('window.__SP_N = 0;' + window.__SPK.replace('const SKINS', 'window.SKINS').replace('function spockSVG', 'window.spockSVG = function').replace(/\+\+SP_N/g, '++window.__SP_N').replace(/curSkin\(\)/g, 'null')); }
const ranksScene = (s, i) => `<div class="sc rks" data-i="${i}"><div class="rk-l"><span class="k">SPOCK Onboarding · hra</span><div class="h">${s.h}</div><div class="s">${s.s}</div>${s.ranks.map((r, k) => `<div class="rk"><b>${k + 1}</b>${r}</div>`).join('')}</div>
  <div class="rk-r"><div class="rk-glow"></div>${s.ranks.map((r, k) => `<div class="rk-sp" data-k="${k}" style="position:absolute;opacity:0;display:flex;flex-direction:column;align-items:center">${window.spockSVG ? window.spockSVG('', window.SKINS[k]) : mascot}<div class="rk-name">${r}</div><div class="rk-sub">${window.SKINS ? window.SKINS[k].n + ' · ' + window.SKINS[k].d : ''}</div></div>`).join('')}</div>
  <div class="chips">${s.chips.map(c => `<span>${c}</span>`).join('')}</div></div>`;
const montage = (s, i) => `<div class="sc" data-i="${i}"><div class="mtg"><div class="mtg-in">${s.msrc.concat(s.msrc).map(u => `<img src="${u}">`).join('')}</div></div><div class="mtg-veil"></div><div class="mtg-t"><div class="h">${s.h}</div><div class="s">${s.s}</div></div></div>`;
const finale = (s, i) => `<div class="sc fin" data-i="${i}"><div class="fin-rays"></div><div class="fin-glow"></div><canvas width="1280" height="720"></canvas>
  <div class="fin-line"></div><div class="fin-arc">${s.stages.map((n, k) => `<div class="st" style="left:${190 + k * 150}px"><i>${k + 1}</i><span>${n}</span></div>`).join('')}</div>
  <div class="fin-mid">${window.pdeLogo ? window.pdeLogo('') : ''}${mascot}</div><div class="fin-h">${s.h}</div><div class="fin-s">${s.s}</div><div class="fin-flash"></div></div>`;
root.innerHTML = SC.map((s, i) => s.teaser ? `<div class="sc tz" data-i="${i}"><div class="tz-box"></div><div class="tz-t"><div class="h">${s.h}</div><div class="s">${s.s}</div></div></div>` : s.ranks ? ranksScene(s, i) : s.montage ? montage(s, i) : s.finale ? finale(s, i) : s.img ? `<div class="sc" data-i="${i}"><div class="txt"><span class="k">${String(i).padStart(2, '0')} · SPOCK Onboarding</span><div class="h">${s.h}</div><div class="s">${s.s}</div></div>${s.mobile ? `<div class="phone"><div class="vp"><img src="${s.src}"></div></div>` : `<div class="win"><div class="bar"><i></i><i></i><i></i></div><div class="vp"><img src="${s.src}"></div></div>`}</div>`
  : s.facts ? `<div class="sc" data-i="${i}"><div class="center fx"><div class="h">${s.h}</div><div class="s">${s.s}</div><div class="facts">${s.facts.map(f => `<div><b>${f[0]}</b><span>${f[1]}</span></div>`).join('')}</div></div></div>`
  : `<div class="sc" data-i="${i}"><div class="center">${mascot}<div class="h">${s.h}</div><div class="s">${s.s}</div></div></div>`).join('');
const ease = x => x < 0 ? 0 : x > 1 ? 1 : 1 - Math.pow(1 - x, 3);
let starts = [], acc = 0; SC.forEach((s, i) => { starts.push(acc); acc += T.scenes[i].dur; }); window.__total = acc;
window.__seek = t => {
  let i = starts.findIndex((a, k) => t >= a && t < a + T.scenes[k].dur); if (i < 0) i = SC.length - 1;
  const lt = t - starts[i], d = T.scenes[i].dur;
  document.querySelectorAll('.sc').forEach(el => { const k = +el.dataset.i; el.style.opacity = k === i ? Math.min(ease(lt / .5), ease((d - lt) / .4)) : 0; });
  const el = document.querySelector(`.sc[data-i="${i}"]`), inn = ease(lt / .8);
  const txt = el.querySelector('.txt, .center'); if (txt) txt.style.transform = `translateY(${(1 - inn) * 24}px)`;
  const img = el.querySelector('.win img'); if (img) img.style.transform = `scale(${1 + .08 * (lt / d)}) translateY(${-(lt / d) * 14}px)`;
  const win = el.querySelector('.win, .phone'); if (win) win.style.transform = `translateX(${(1 - inn) * 60}px)`;
  const ph = el.querySelector('.phone img'); if (ph) { const max = ph.offsetHeight - ph.parentNode.offsetHeight; ph.style.top = -Math.max(0, max) * ease(Math.max(0, lt - 1.2) / (d - 1.5)) * .35 + 'px'; }
  el.querySelectorAll('.facts div').forEach((f, k) => { const a = ease((lt - .4 - k * .25) / .5); f.style.opacity = a; f.style.transform = `translateY(${(1 - a) * 16}px)`; });
  const mt = el.querySelector('.mtg-in'); if (mt) { const k = lt / d; mt.style.transform = `translate(-50%,-50%) rotateX(${22 - k * 8}deg) rotateZ(${-10 + k * 4}deg) scale(${1.25 - k * .3}) translateY(${-k * 120}px)`; const tt = el.querySelector('.mtg-t'); tt.style.opacity = ease((lt - .3) / .6); tt.style.transform = `scale(${.94 + .06 * ease((lt - .3) / .8)})`; }
  if (el.classList.contains('fin')) { finaleSeek(el, lt, d); }
  if (el.classList.contains('tz')) { const t1 = el.querySelector('.tz-t'); t1.style.opacity = ease((lt - .5) / .6); el.querySelector('.tz-t .s').style.opacity = ease((lt - (d - 2.4)) / .5); }
  if (el.classList.contains('rks')) {
    const per = Math.max(1.1, (d - 3.2) / 6), cur = Math.min(5, Math.floor(Math.max(0, lt - .8) / per));
    el.querySelectorAll('.rk').forEach((r, k) => { r.classList.toggle('on', k <= cur && lt > .8); r.classList.toggle('cur', k === cur && lt > .8); });
    el.querySelectorAll('.rk-sp').forEach((sp, k) => { const a = lt - .8 - k * per, vis = k === cur && lt > .8; const pop = vis ? Math.min(1, a / .35) : 0;
      sp.style.opacity = vis ? pop : 0; sp.style.transform = `scale(${vis ? .7 + .3 * pop + (pop < 1 ? 0 : Math.sin(Math.min(1, (a - .35) / .4) * Math.PI) * .05) : .7}) translateY(${Math.sin(lt * 2.2) * 6}px)`; });
    el.querySelector('.rk-glow').style.transform = `scale(${1 + Math.sin(lt * 2) * .05})`;
    el.querySelectorAll('.chips span').forEach((c, k) => { const a = ease((lt - (d * .45) - k * .3) / .5); c.style.opacity = a; c.style.transform = `translateY(${(1 - a) * 14}px)`; });
  }
  const m = el.querySelector('.fin-mid .mascot') ? null : el.querySelector('.mascot'); if (m) m.style.transform = `translateY(${Math.sin(t * 2.2) * 8}px) rotate(${Math.sin(t * 1.3) * 3}deg)`;
  const c = (T.scenes[i].caps || []).find(c => lt >= c[0] && lt < c[1] + .25); document.getElementById('cap').textContent = c ? c[2] : '';
  document.getElementById('prog').style.width = (t / acc * 100) + '%';
  document.getElementById('stars').style.transform = `translateX(${-t * 6}px)`;
};

/* finále: sedm fází se rozsvítí, výbuch světla, ohňostroj, Spock a logo PDE, nadpis s leskem */
function finaleSeek(el, lt, d){
  const B = 3.1;
  el.querySelectorAll('.st').forEach((st, k) => { const a = lt - (.25 + k * .38); st.classList.toggle('on', a > 0); st.style.opacity = Math.min(1, .35 + ease(a / .3) * .65); st.style.transform = `translateY(${Math.max(0, 1 - ease(a / .4)) * -14}px) scale(${a > 0 && a < .35 ? 1 + Math.sin(a / .35 * Math.PI) * .25 : 1})`; });
  const ln = el.querySelector('.fin-line'), pr = Math.max(0, Math.min(6, (lt - .25) / .38)); ln.style.left = '190px'; ln.style.width = (pr * 150) + 'px';
  const after = lt - B, burst = ease(after / .9);
  el.querySelector('.fin-flash').style.opacity = after > 0 ? Math.max(0, .75 - after * 1.6) : 0;
  el.querySelector('.fin-rays').style.opacity = after > 0 ? Math.min(.9, after * 1.2) : 0; el.querySelector('.fin-rays').style.transform = `rotate(${lt * 9}deg) scale(${.6 + burst * .5})`;
  el.querySelector('.fin-glow').style.opacity = after > 0 ? Math.min(1, after * 1.5) * (.85 + Math.sin(lt * 3) * .15) : 0; el.querySelector('.fin-glow').style.transform = `scale(${.5 + burst * .6})`;
  const mid = el.querySelector('.fin-mid'), pop = after > .1 ? 1 - Math.pow(1 - Math.min(1, (after - .1) / .7), 3) * Math.cos(Math.min(1, (after - .1) / .7) * 6) * .0 : 0;
  const sc = after > .1 ? Math.min(1, (after - .1) / .6) : 0, over = sc < 1 ? sc * 1.15 : 1 + Math.sin(Math.min(1, (after - .7) / .5) * Math.PI) * .06;
  mid.style.opacity = sc; mid.style.transform = `scale(${Math.max(.01, Math.min(sc * 1.12, over))}) translateY(${Math.sin(lt * 2.2) * 5}px)`;
  const mm = mid.querySelector('.mascot'); if (mm) mm.style.transform = `rotate(${Math.sin(lt * 1.6) * 4}deg)`;
  const h = el.querySelector('.fin-h'); h.style.opacity = ease((after - .9) / .6); h.style.transform = `translateY(${(1 - ease((after - .9) / .6)) * 20}px)`; h.style.backgroundPosition = `${100 - Math.min(1, Math.max(0, (after - 1.5) / 1.6)) * 100}% 0`;
  const s2 = el.querySelector('.fin-s'); s2.style.opacity = ease((after - 1.8) / .6);
  const cv = el.querySelector('canvas'), x = cv.getContext('2d'); x.clearRect(0, 0, 1280, 720);
  const cols = ['#F29AC0', '#B9A6FF', '#7DE3FF', '#FFD27D', '#ffffff', '#E15079'];
  [[B, 640, 315, 70], [B + 1.3, 300, 250, 46], [B + 2.0, 980, 240, 46], [B + 3.4, 420, 380, 40], [B + 4.1, 860, 400, 40], [d - 3.2, 640, 230, 60]].forEach(([t0, cx, cy, N], bi) => {
    const a = lt - t0; if (a < 0 || a > 2.6) return;
    for (let k = 0; k < N; k++) { const ang = k / N * Math.PI * 2 + bi, sp = 170 + ((k * 37 + bi * 13) % 9) * 22, px = cx + Math.cos(ang) * sp * a, py = cy + Math.sin(ang) * sp * a + 70 * a * a, al = Math.max(0, 1 - a / 2.4);
      x.globalAlpha = al; x.fillStyle = cols[(k + bi) % cols.length]; x.beginPath(); x.arc(px, py, 2.6 + (k % 3), 0, Math.PI * 2); x.fill();
      x.globalAlpha = al * .35; x.beginPath(); x.arc(cx + Math.cos(ang) * sp * a * .85, cy + Math.sin(ang) * sp * a * .85 + 50 * a * a, 1.6, 0, Math.PI * 2); x.fill(); } });
  x.globalAlpha = 1;
}
</script></body></html>
