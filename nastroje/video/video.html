<!doctype html><html lang="cs"><head><meta charset="utf-8"><title>SPOCK krok za krokem</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1280px;height:720px;overflow:hidden;background:#0b1b3f;color:#fff;font-family:Inter,"Inter Display",system-ui,sans-serif}
.stage{position:absolute;inset:0;background:radial-gradient(900px 620px at 50% 46%,#12306e 0%,#0d2152 45%,#0a1838 100%);overflow:hidden}
.ring{position:absolute;left:50%;top:46%;border:1px solid rgba(255,255,255,.06);border-radius:50%;transform:translate(-50%,-50%)}
.scene{position:absolute;inset:0;padding:38px 64px 130px;display:none}
.scene.on{display:block}
.a{opacity:0;animation:rise .7s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--d,0)*1s)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.pop{opacity:0;animation:pop .5s cubic-bezier(.2,1.3,.4,1) both;animation-delay:calc(var(--d,0)*1s)}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
.grow{transform-origin:left center;animation:grow .9s ease both;animation-delay:calc(var(--d,0)*1s)}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.logo{width:150px;height:150px;border-radius:32px;background:#1068D2;display:grid;place-items:center}
.logo svg{width:100%;height:100%}
.hero{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;text-align:center;gap:22px;padding-bottom:110px}
.hero .row{display:flex;align-items:center;gap:34px}
.hero .wm{font-size:150px;font-weight:800;letter-spacing:.06em;line-height:1}
.hero .bar{width:240px;height:4px;border-radius:4px;background:#5b9bff}
.hero h1{font-size:40px;font-weight:700}
.hero p{font-size:27px;color:#b8c7e6}
.top{display:flex;align-items:center;gap:22px;margin-bottom:20px;padding-right:150px}
.no{width:86px;height:86px;border-radius:22px;background:#1068D2;display:grid;place-items:center;font-size:44px;font-weight:800;flex:none}
.top small{display:block;font-size:19px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#8fb4ff}
.top h2{font-size:50px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.agent{margin-left:auto;text-align:right;padding-top:14px;font-size:19px;color:#b8c7e6}.agent b{display:block;font-size:25px;color:#fff}
.cols{display:grid;grid-template-columns:410px 1fr;gap:30px;align-items:start}
.io{display:grid;gap:11px;align-content:start}
.box{border:1px solid rgba(255,255,255,.14);border-radius:14px;background:rgba(255,255,255,.05);padding:12px 16px}
.box small{display:block;font-size:15px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#8fb4ff;margin-bottom:6px}
.box b{font-size:21px;line-height:1.28;font-weight:600}
.task{white-space:nowrap;font-family:"DejaVu Sans Mono",monospace;font-size:14.5px;background:rgba(0,0,0,.28);border-radius:8px;padding:6px 10px;display:inline-block;margin-top:4px;color:#d7e4ff}
.doc{border-radius:16px;background:#f5f8fd;color:#0d1b33;padding:22px 26px;box-shadow:0 18px 50px rgba(0,0,0,.35);min-height:300px}
.doc .fn{font-family:"DejaVu Sans Mono",monospace;font-size:15px;color:#5c6f8f;margin-bottom:10px}
.doc h3{font-size:25px;font-weight:800;margin-bottom:10px;line-height:1.2}
.doc p{font-size:19.5px;line-height:1.42;margin-bottom:8px}
.doc ul{list-style:none;display:grid;gap:8px}
.doc li{font-size:19px;line-height:1.3;padding:8px 13px;border-radius:10px;background:#e7eefb;display:flex;gap:10px;align-items:baseline}
.doc li b{flex:none;color:#1068D2}
.doc li.sel{background:#1068D2;color:#fff}.doc li.sel b{color:#fff}
.tag{display:inline-block;font-size:14px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:99px;padding:3px 10px;margin-left:auto;flex:none}
.tag.s{background:#d3f3e2;color:#0d6b3f}.tag.w{background:#fde7c7;color:#8a5200}
.chips{display:flex;flex-wrap:wrap;gap:9px}.chips span{font-size:19px;font-weight:600;background:#e7eefb;border-radius:99px;padding:7px 14px}
.gates{display:flex;align-items:center;gap:16px;margin-top:18px}
.gate{display:flex;align-items:center;gap:12px;border-radius:99px;padding:9px 18px;font-size:20px;font-weight:700}
.gate.q{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2)}
.gate.g{background:#fff;color:#0d1b33}
.gate.n{background:transparent;border:1px dashed rgba(255,255,255,.4);color:#b8c7e6}
.gate i{font-style:normal;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:17px;background:#2fbf7a;color:#fff}
.gate.g i{background:#1068D2}
.arrow{font-size:26px;color:#8fb4ff}
.chain{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:34px}
.chain span{font-size:21px;font-weight:700;border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:10px 14px;background:rgba(255,255,255,.06)}
.chain em{font-style:normal;color:#8fb4ff;font-size:22px}
.cap{position:absolute;left:0;right:0;bottom:0;height:118px;background:linear-gradient(transparent,rgba(4,10,26,.92) 38%);display:grid;place-items:center;padding:26px 110px 18px;text-align:center}
.cap span{font-size:28px;font-weight:600;line-height:1.3;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.prog{position:absolute;left:0;bottom:0;height:5px;background:#5b9bff}
.mini{position:absolute;right:40px;top:22px;display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.1em;font-size:19px;opacity:.9}
.mini .logo{width:36px;height:36px;border-radius:9px}
</style></head><body>

const q = new URLSearchParams(location.search), only = q.get('scene');
const list = only ? SC.filter(s => s.id === only) : SC;
const total = list.reduce((n, s) => n + s.dur, 0);
document.getElementById('scenes').innerHTML = list.map(s => `<div class="scene" data-id="${s.id}">${s.html}</div>`).join('');
document.querySelectorAll('.logo').forEach(l => { if (l.textContent === 'LOGO') l.innerHTML = LOGO; });
window.__total = total; window.__scenes = SC.map(s => ({id:s.id, dur:s.dur}));
/* deterministické vykreslení času t (v sekundách): animace se nepouštějí, jen se nastaví jejich čas */
window.__seek = t => {
  let acc = 0, cur = list[list.length - 1], lt = cur.dur;
  for (const s of list) { if (t < acc + s.dur) { cur = s; lt = t - acc; break; } acc += s.dur; }
  document.querySelectorAll('.scene').forEach(el => el.classList.toggle('on', el.dataset.id === cur.id));
  const el = document.querySelector('.scene.on');
  const fade = Math.min(1, lt / .4, (cur.dur - lt) / .4); el.style.opacity = Math.max(0, fade);
  el.getAnimations({subtree:true}).forEach(a => { a.pause(); a.currentTime = lt * 1000; });
  const c = cur.caps.find(c => lt >= c[0] && lt < c[1]); document.getElementById('cap').textContent = c ? c[2] : '';
  document.getElementById('prog').style.width = (100 * t / total) + '%';
  document.getElementById('mini').style.display = (cur.id === 'uvod' || cur.id === 'zaver') ? 'none' : 'flex';
};
window.__seek(0);
